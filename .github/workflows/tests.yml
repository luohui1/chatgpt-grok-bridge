name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated tests without Grok
        env:
          GROK_SUBAGENT_EXE: C:/grok-not-installed-fixture/grok.exe
        run: python -m unittest discover -s plugins/grok-subagent/tests -v
